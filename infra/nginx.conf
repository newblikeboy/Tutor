# Operator template. Replace example.com and certificate paths after obtaining a domain/TLS certificate.
# No automatic production deployment is performed by this repository.
server {
    listen 80;
    server_name example.com;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name example.com;
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/tutor/current/web;
    index index.html;
    # JSON/base64 upload envelope (3 MiB file); Go applies smaller per-route limits.
    # Application MP4 uploads use bounded base64 JSON; Go retains smaller limits elsewhere.
    client_max_body_size 35m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        access_log off;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        # Keep parent security headers inherited; expires sets only cache headers.
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
    location ~ /\. { deny all; }
}
