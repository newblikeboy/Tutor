  "components": {
    "securitySchemes": {
      "session": {
        "type": "apiKey",
        "in": "cookie",
        "name": "session"
      }
    },
    "schemas": {
      "User": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "name",
          "role",
          "sample"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "parent",
              "tutor",
              "mentor",
              "admin",
              "support",
              "finance"
            ]
          },
          "sample": {
            "type": "boolean"
          }
        }
      },
      "Scope": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "subject",
          "minClass",
          "maxClass",
          "mode",
          "expiresAt"
        ],
        "properties": {
          "subject": {
            "type": "string"
          },
          "minClass": {
            "type": "integer"
          },
          "maxClass": {
            "type": "integer"
          },
          "mode": {
            "type": "string"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "PublicTutor": {
        "type": "object",
        "additionalProperties": false,
        "required": [
